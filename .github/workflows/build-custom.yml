name: Build Custom ESP32

on:
  push:
    branches:
      - xiaozhi-custom-music
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32 WROOM OLED
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build ESP32 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py bread-compact-esp32 --name bread-compact-esp32

      - name: Verify English, OLED and MP3 configuration
        shell: bash
        run: |
          echo "Checking English language..."
          grep '^CONFIG_LANGUAGE_EN_US=y$' sdkconfig

          echo "Checking SSD1306 128x64 OLED..."
          grep '^CONFIG_OLED_SSD1306_128X64=y$' sdkconfig

          echo "Checking MP3 decoder configuration..."
          if grep -q '^CONFIG_AUDIO_DECODER_MP3_SUPPORT=y$' sdkconfig; then
            echo "MP3 decoder support is enabled."
          else
            echo "MP3 decoder option is not enabled or is unavailable."
            echo "This is a diagnostic check, not a build failure."
          fi

          echo "Configuration verification completed!"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-wroom-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
