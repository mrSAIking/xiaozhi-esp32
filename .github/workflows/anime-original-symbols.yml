name: Recover original anime companion symbols
on:
  push:
    branches: [anime-companion]
    paths: [.github/workflows/anime-original-symbols.yml]
permissions:
  contents: read
  actions: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1@sha256:4d57a2457abd207dfe10f98bf092f21634d3e87d9395d3209e3696a188590892
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b76f86fd388a9ffa44057fe5309e58b19fd7b9f
      - name: Recreate the original build and test its ELF identity
        shell: bash
        env:
          SOURCE_DATE_EPOCH: 1795675340
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/build.py anime-companion-s3 --name anime-companion-s3
          mkdir -p /tmp/recovery
          python - <<'PY' | tee /tmp/recovery/identity.txt
          import hashlib, io, os, struct, urllib.request, zipfile
          from pathlib import Path

          url = 'https://api.github.com/repos/mrSAIking/xiaozhi-esp32/actions/artifacts/15092859403/zip'
          request = urllib.request.Request(url)
          request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          # The public GitHub artifact establishes the original ELF identity.
          archive = urllib.request.urlopen(request, timeout=60).read()
          assert hashlib.sha256(archive).hexdigest() == 'dab10623917dbd9cef2a3ff9a19e4da5a4ae0a12affccc361c771dedb5d80488'
          original = zipfile.ZipFile(io.BytesIO(archive)).read('merged-binary.bin')[0x20000:]
          candidate = Path('build/xiaozhi.bin').read_bytes()
          expected = '6c9ffbab75dc8bd9345dd3f0b59249df6afcfa1760d661cf5c63635735fed9ee'
          assert original[0xb0:0xd0].hex() == expected
          digest = hashlib.sha256(Path('build/xiaozhi.elf').read_bytes()).hexdigest()
          print('Original ELF SHA-256 ', expected)
          print('Candidate ELF SHA-256', digest)
          print('Exact ELF match:', expected == digest)

          def segments(image):
              cursor = 24
              for _ in range(image[1]):
                  address, length = struct.unpack_from('<II', image, cursor)
                  cursor += 8
                  yield address, image[cursor:cursor+length]
                  cursor += length

          orig, rebuilt = dict(segments(original)), dict(segments(candidate))
          pcs = [0x421a8a4a, 0x421a74f5, 0x420be35c]
          for address, data in orig.items():
              if any(address <= pc < address + len(data) for pc in pcs):
                  other = rebuilt.get(address, b'')
                  print(f'Code segment {address:#010x}, original/candidate lengths {len(data)}/{len(other)}, byte match {data == other}')
          PY
          xtensa-esp32s3-elf-addr2line -aipfC -e build/xiaozhi.elf \
            0x421a8a4d 0x421a8a4a 0x420d62db 0x420d63dd 0x420d6030 0x420d668c 0x420cd53e \
            0x420ce32f 0x420cea5f 0x420e64f1 0x420e2785 0x420cd08d 0x420cd0cd 0x420cd148 \
            0x420ce22b 0x420dc391 0x421a74f5 0x420c6909 0x420c6a10 0x420cb3da 0x420cafe2 \
            0x420cb47d 0x420cafe2 0x420cb707 0x420cb7b7 0x420cb85f 0x420cbf15 0x420d5edc \
            0x420be35c | tee /tmp/recovery/candidate-backtrace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: original-symbol-recovery-candidate
          path: |
            build/xiaozhi.elf
            build/xiaozhi.map
            /tmp/recovery/*.txt
          if-no-files-found: error
