name: Anime Companion S3
on:
  workflow_dispatch:
  push:
    branches: [anime-companion]

permissions:
  contents: read

jobs:
  firmware:
    if: github.ref == 'refs/heads/anime-companion'
    strategy:
      fail-fast: false
      matrix:
        spi_mhz: [10, 20, 27, 40]
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate character banks and host behavior
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install Pillow numpy
          python character/scripts/validate_assets.py
          python character/scripts/aura_assets.py --check
          python -m unittest discover -s scripts/tests -v
          g++ -std=c++17 -pthread -Imain/audio -Imain/boards/anime-companion-s3 \
            scripts/tests/anime_animation_test.cc -o /tmp/test-avatar
          /tmp/test-avatar
          g++ -O2 -std=c++17 -Imain/boards/anime-companion-s3 scripts/tests/anime_pose_test.cc -o /tmp/test-pose
          /tmp/test-pose
          g++ -O2 -std=c++17 -Imain/boards/anime-companion-s3 scripts/tests/aura_ui_test.cc -o /tmp/test-ui
          /tmp/test-ui
      - name: Render and verify desktop previews
        if: matrix.spi_mhz == 10
        run: |
          source "$IDF_PATH/export.sh"
          g++ -O2 -std=c++17 -Imain/boards/anime-companion-s3 scripts/anime_preview.cc -o /tmp/avatar-preview
          python scripts/anime_preview.py /tmp/avatar-preview previews
      - uses: actions/upload-artifact@v4
        if: matrix.spi_mhz == 10
        with:
          name: desktop-previews-${{ github.sha }}
          path: |
            previews/*.gif
            main/boards/anime-companion-s3/web/*preview.png
          if-no-files-found: error
      - name: Build ESP32-S3 N16R8 firmware
        run: |
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py --version
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('main/boards/anime-companion-s3/config.json')
          board = json.loads(p.read_text())
          board['builds'][0]['sdkconfig_append'].append('CONFIG_ANIME_SPI_MHZ=${{ matrix.spi_mhz }}')
          p.write_text(json.dumps(board))
          PY
          python scripts/build.py anime-companion-s3 --name anime-companion-s3
      - name: Verify merged image and report memory use
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/test_aura_service_host.py
          python -m unittest discover -s scripts/tests -p test_assets.py -v
          grep -Fx '# CONFIG_ANIME_PANEL_SELF_TEST is not set' sdkconfig
          grep -Fx CONFIG_ANIME_BREATH_PERIOD_MS=4800 sdkconfig
          grep -Fx CONFIG_ANIME_SPI_MHZ=${{ matrix.spi_mhz }} sdkconfig
          grep -Fx CONFIG_ESP_BROWNOUT_DET=y sdkconfig
          grep -Fx CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK=y sdkconfig
          grep -Fx CONFIG_ESP_COREDUMP_ENABLE_TO_UART=y sdkconfig
          cp main/boards/anime-companion-s3/13631e6-backtrace.txt build/
          test -s build/xiaozhi.elf
          test -s build/xiaozhi.map
          sha256sum build/xiaozhi.elf | tee -a "$GITHUB_STEP_SUMMARY"
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" \
            build/partition_table/partition-table.bin /tmp/actual-partitions.csv
          python scripts/check_anime_image.py build /tmp/actual-partitions.csv | tee -a "$GITHUB_STEP_SUMMARY"
          idf.py size | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: anime-companion-s3-${{ matrix.spi_mhz }}MHz-${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/xiaozhi.elf
            build/xiaozhi.map
            build/13631e6-backtrace.txt
          if-no-files-found: error
